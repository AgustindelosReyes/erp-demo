name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout erp-demo
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Start Docker Compose services
        run: docker-compose up -d

      - name: Initial container status check
        run: |
          echo "=== Docker PS ==="
          docker ps
          echo "=== Docker Stats ==="
          docker stats --no-stream
          echo "=== Docker Compose Logs (tail) ==="
          docker-compose logs --tail 20

      - name: Create .env file
        run: |
          cat > .env << EOF
          # Database Configuration
          DB_CONNECTION=mysql
          DB_HOST=mysql_db
          DB_PORT=3306
          DB_DATABASE=erp_demo
          DB_USERNAME=erp_user
          DB_PASSWORD=erp_password
          DB_ROOT_PASSWORD=root_password
          # Application Configuration
          APP_NAME="ERP Demo"
          APP_ENV=local
          APP_KEY=base64:$(openssl rand -base64 32)
          APP_DEBUG=true
          APP_URL=http://localhost:8000
          # Laravel Sanctum
          SANCTUM_STATEFUL_DOMAINS=localhost:3000
          # Cache and Session
          CACHE_DRIVER=file
          SESSION_DRIVER=file
          SESSION_LIFETIME=120
          # Queue
          QUEUE_CONNECTION=sync
          # Mail
          MAIL_MAILER=log
          MAIL_HOST=127.0.0.1
          MAIL_PORT=2525
          MAIL_USERNAME=null
          MAIL_PASSWORD=null
          MAIL_ENCRYPTION=null
          MAIL_FROM_ADDRESS="hello@example.com"
          MAIL_FROM_NAME="${APP_NAME}"
          # Broadcasting
          BROADCAST_DRIVER=log
          # Logging
          LOG_CHANNEL=stack
          LOG_DEPRECATIONS_CHANNEL=null
          LOG_LEVEL=debug
          # Vite
          VITE_APP_NAME="${APP_NAME}"
          EOF
      - name: Copy .env
        run: |
          timeout=300
          elapsed=0
          container_id=$(docker-compose ps -q laravel_app)
          while [ "$elapsed" -lt "$timeout" ]; do
            if [ "$(docker inspect -f '{{.State.Running}}' $container_id)" = "true" ]; then
              break
            fi
            sleep 1
            elapsed=$((elapsed + 1))
          done
          if [ "$elapsed" -ge "$timeout" ]; then
            echo "Timeout waiting for container" >&2
            docker-compose logs > docker-compose-error.log 2>&1
            docker-compose down
            exit 1
          fi
          docker cp ./backend/.env $container_id:/var/www/.env
          if [ $? -ne 0 ]; then
            echo "Error: Failed to copy .env file to container" >&2
            docker-compose logs > docker-compose-error.log 2>&1
            docker-compose down
            exit 1
          fi

      - name: Verify container health
        run: |
          timeout=30
          elapsed=0
          while [ "$elapsed" -lt "$timeout" ]; do
            if docker exec $(docker-compose ps -q laravel_app) php artisan --version > /dev/null 2>&1; then
              break
            fi
            sleep 1
            elapsed=$((elapsed + 1))
          done
          if [ "$elapsed" -ge "$timeout" ]; then
            echo "App not ready" >&2
            docker-compose logs > docker-compose-error.log 2>&1
            docker-compose down
            exit 1
          fi

      - name: Health verification logs
        run: |
          echo "=== Health Check Logs ==="
          docker-compose logs laravel_app --tail 20

      - name: Run migrations
        run: |
          if docker exec $(docker-compose ps -q laravel_app) php artisan migrate:status 2>/dev/null | grep -q "Pending"; then
            docker exec $(docker-compose ps -q laravel_app) php artisan migrate
            if [ $? -ne 0 ]; then
              echo "Error: Failed to run migrations" >&2
              docker-compose logs > artisan-error.log 2>&1
              docker-compose down
              exit 1
            fi
          else
            echo "Migrations already completed by start.sh"
          fi

      - name: Output final logs
        if: always()
        run: |
          echo "=== Final Docker Compose Logs ==="
          docker-compose logs --tail 100

      - name: Cleanup
        if: always()
        run: docker-compose down