name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Create .env file
      run: |
        cp .env .env.ci
        echo "DB_HOST=mysql_db" >> .env.ci
        echo "DB_ROOT_PASSWORD=root_password" >> .env.ci
        echo "DB_DATABASE=erp_demo" >> .env.ci
        echo "DB_USERNAME=erp_user" >> .env.ci
        echo "DB_PASSWORD=erp_password" >> .env.ci
        echo "APP_ENV=testing" >> .env.ci

    - name: Build and start services
      run: docker compose --env-file .env.ci up -d --build

    - name: Wait for services to be ready
      run: |
        sleep 30
        docker compose --env-file .env.ci exec -T laravel_app php artisan migrate --force
        docker compose --env-file .env.ci exec -T laravel_app php artisan db:seed --force

    - name: Run Laravel backend tests
      run: docker compose --env-file .env.ci exec -T laravel_app php artisan test

    - name: Install Playwright dependencies
      run: |
        cd erp-testing
        npm ci
        npx playwright install --with-deps

    - name: Run Playwright e2e tests
      run: |
        cd erp-testing
        npx playwright test

    - name: Stop services
      run: docker compose --env-file .env.ci down
      if: always()
